name: Flutter Build & Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create GitHub Releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Decode keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          fi

      - name: Print keystore SHA-1 (for Firebase Console registration)
        run: |
          if [ -f "android/app/upload-keystore.jks" ]; then
            echo "=== KEYSTORE FINGERPRINTS (add SHA-1 to Firebase Console) ==="
            keytool -list -v \
              -keystore android/app/upload-keystore.jks \
              -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
              2>/dev/null | grep -E "SHA1|SHA256" || true
            echo "=== END FINGERPRINTS ==="
          fi

      - name: Create key.properties
        run: |
          if [ -f "android/app/upload-keystore.jks" ]; then
            cat <<EOF > android/key.properties
            storePassword=${{ secrets.KEYSTORE_PASSWORD }}
            keyPassword=${{ secrets.KEY_PASSWORD }}
            keyAlias=${{ secrets.KEY_ALIAS }}
            storeFile=../app/upload-keystore.jks
            EOF
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer
        run: flutter analyze --no-fatal-infos

      - name: Get app version from pubspec.yaml
        id: version
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}' | tr -d '\r')
          VERSION_NAME=$(echo "$RAW_VERSION" | cut -d'+' -f1)
          BUILD_NUM=$(echo "$RAW_VERSION" | cut -d'+' -f2)
          # Clean tag version without '+' for glob matching and GitHub Release compatibility
          TAG_NAME="v${VERSION_NAME}-build${BUILD_NUM}"
          CLEAN_FILENAME="fiscora-v${VERSION_NAME}-b${BUILD_NUM}.apk"
          echo "raw=$RAW_VERSION" >> $GITHUB_OUTPUT
          echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "filename=$CLEAN_FILENAME" >> $GITHUB_OUTPUT
          echo "Building version: $RAW_VERSION (Tag: $TAG_NAME, Filename: $CLEAN_FILENAME)"

      - name: Build Android APK
        run: flutter build apk --release

      - name: Rename APK with version
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/${{ steps.version.outputs.filename }}

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fiscora-${{ steps.version.outputs.tag }}
          path: build/app/outputs/flutter-apk/${{ steps.version.outputs.filename }}
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Fiscora ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          make_latest: true
          files: |
            build/app/outputs/flutter-apk/*.apk

